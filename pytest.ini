[pytest]
; ───────────────────────── 目录与收集 ─────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; ───────────────────────── 分批 (改啥才测啥) ─────────────────────────
; 默认**只跑基本测试**; UI 与连通性必须**显式指定**才跑:
;   · 默认            : pytest                     (本文件即生效, 任何调用方式都一样)
;   · 只跑 UI         : pytest -m ui                (-m 是单值选项, 命令行会覆盖下面这个)
;   · 只跑连通性      : pytest -m connectivity
;   · 全量 (发布前必跑): pytest -o addopts="" -n 2 --dist loadfile --timeout=120
;
; ⚠⚠ 这些设置**必须放在仓库根**, 不能放在 tests/ 下 (2026-10-03 实测踩到):
;   pytest 只在**参数所在目录的祖先链**里找配置文件。写成 tests/pytest.ini 时,
;   `pytest tests/` 会加载它, 而**不带参数的 `pytest` (从仓库根跑) 不会** ——
;   于是同一个仓库出现两套行为: 前者并行+有超时+有过滤, 后者**串行+无超时+连 UI 都收**,
;   而后者正是实测**唯一会挂死**的组合 (串行 >600s 只能手动杀)。
;   "行为随调用方式而变"就是那类最难查的问题, 所以只保留根目录这一份配置。
;
; ───────────────────────── 为什么是 -n 2 ─────────────────────────
; 本套件有**固定端口**依赖 (443 / 44500 / 44501 / PROXY_PORT 及 +1..+4 等), 并行度一高
; 就互相抢端口, 表现为 worker 被打死: [gw1] node down: Not properly terminated,
; 然后整轮无法收尾。实测对照 (同一份用例):
;   串行        → 卡在 39%/53%, >600s 只能手动杀
;   -n auto(20) → >10 分钟, 最差 (每个 worker 各起 Qt + 抢固定端口)
;   -n 4        → 卡住, 出现 node down
;   -n 2        → 完整跑完 (~185s)   ← 所以默认取 2, 是"能跑完"与"够快"的平衡点
; --dist loadfile 让**同一个文件只落在一个 worker**, 避免文件内固定端口自冲突。
;
; ⚠ `--timeout` 只是兜底, **不能指望它救挂死**: Windows 上 pytest-timeout 只能用
;   线程法, 中断不了阻塞中的 C 层等待 (实测: 5 个 python 进程 CPU 平坦不再增长 =
;   阻塞等待, 而 --timeout 到点也没能收尾)。真正解决挂死的是上面的并行度选择。
addopts = -n 2 --dist loadfile --timeout=120 -m "not ui and not connectivity"

timeout_method = thread

markers =
    ui: 需要 Qt/GUI 的用例 (慢且占固定端口)。默认不跑, 用 -m ui 显式跑
    connectivity: 真正依赖外部网络的用例。默认不跑, 用 -m connectivity 显式跑。
        注意: 这个标记**故意留空** —— 曾按文件名把 test_github_stability /
        test_gateway_anti_hijack / test_l4_relay_proxy 归为连通性, 逐个读源码后发现
        全都不走真实网络 (前两个是配置/策略断言, 第三个所有 socket 都是 127.0.0.1)。
        按错的猜测排除 = 静默不测, 比慢得多更糟; 要标必须先读源码确认。
