# GitHub Releases 附件与源码包高速下载 (流式直传，关闭缓冲防止临时盘打满)
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name objects.githubusercontent.com github-releases.githubusercontent.com media.githubusercontent.com;

    client_max_body_size 500M;

    location / {
        proxy_pass https://upstream_github_release;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_ssl_name "";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
    }
}

# GitLab 国际版
