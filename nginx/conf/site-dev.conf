# ==============================================================================
# PixivToolkit - 开发者与 AI 模型平台加速规则配置 (GitHub / GitLab / HuggingFace)
# ==============================================================================

# GitHub 主站 Web、API 与 Gist
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name github.com www.github.com *.github.com api.github.com gist.github.com codeload.github.com *.github.dev redirect.github.com copilot.github.com services.github.com community.github.com education.github.com enterprise.github.com classroom.github.com central.github.com collector.github.com;

    client_max_body_size 500M;

    location / {
        proxy_pass https://upstream_github_web;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_name "";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 5s;
    }
}

# GitHub 前端 JS/CSS 静态 CDN (Fastly .154 Anycast 集群, 直连 500 为服务端对根路径的正常响应)
