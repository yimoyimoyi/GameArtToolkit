# ==========================================
# Pixiv 站点反向代理配置
# ==========================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    access_log off;
    return 301 https://$host$request_uri;
}

# Pixiv Web & API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pixiv.net pixiv.net accounts.pixiv.net app-api.pixiv.net oauth.secure.pixiv.net touch.pixiv.net sketch.pixiv.net comic.pixiv.net novel.pixiv.net dic.pixiv.net;

    include cert.conf;

    location / {
        proxy_pass https://www-pixiv-net;
        include shared-proxy-empty-sni.conf;
        proxy_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /ajax/ {
        proxy_pass https://www-pixiv-net;
        include shared-proxy-empty-sni.conf;
        proxy_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass https://www-pixiv-net;
        include shared-proxy-empty-sni.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# Pixiv Fanbox
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fanbox.cc *.fanbox.cc api.fanbox.cc downloads.fanbox.cc;

    include cert.conf;

    location / {
        proxy_pass https://api-fanbox-cc;
        include shared-proxy-params.conf;
        proxy_ssl_name $http_host;
        proxy_read_timeout 60s;
    }
}

# Pixiv 图片 CDN (启用本地磁盘缓存加速)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.pximg.net s.pximg.net i.pximg.net source.pixiv.net imgaz.pixiv.net;

    include cert.conf;

    location / {
        proxy_pass https://i-pximg-net;
        include shared-proxy-empty-sni.conf;
        proxy_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
        proxy_set_header Referer "https://www.pixiv.net/";
        proxy_set_header Sec-Fetch-Site "cross-site";

        # 启用本地缓存
        proxy_cache pixiv_cache;
        proxy_cache_valid 200 302 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
