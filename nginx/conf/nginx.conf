# ==============================================================================
# PixivToolkit - 高性能便携式 Nginx 主配置文件 (Windows 优化版)
# ==============================================================================

worker_processes 1;

events {
    # Windows nginx 使用 select() 事件模型, FD 上限硬限 1024, 高于此值无效
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 域名 Hash 表调优 (支持 28 项全生态海量加速域名与通配符)
    server_names_hash_bucket_size 256;
    server_names_hash_max_size 4096;

    # WebSocket 升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 传输性能调优
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip 极速压缩
    gzip  on;
    gzip_min_length 1k;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json image/svg+xml;

    # 全局 SSL 与 Universal Root CA 签发的服务端通配证书
    ssl_certificate      ca/pixiv.net.crt;
    ssl_certificate_key  ca/pixiv.net.key;
    ssl_session_cache    shared:SSL:20m;
    ssl_session_timeout  1d;
    ssl_session_tickets  on;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;

    # 全局反向代理默认 SSL 与缓冲区策略 (支持 GitHub / Civitai 超大响应头)
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_headers_hash_max_size 8192;

    # 本地图片高速磁盘缓存配置
    proxy_cache_path cache/img levels=1:2 keys_zone=pixiv_img_cache:64m inactive=30d max_size=5g;
    proxy_cache_key $scheme$proxy_host$uri$is_args$args;

    # 引入动态 Upstream 节点配置
    include upstream-dynamic.conf;

    # 引入 3 大分类站点规则 (site-tools.conf 服务全部直连不可用已删除)
    include site-gaming.conf;
    include site-acg.conf;
    include site-dev.conf;
}
