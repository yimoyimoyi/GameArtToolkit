# ==============================================================================
# PixivToolkit - 便携式 Nginx 主配置文件 (Windows 优化版)
# ==============================================================================

worker_processes 1;

events {
    # Windows nginx 使用 select() 事件模型, FD 上限硬限 1024, 高于此值无效
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 域名 Hash 表调优 (支持多服务加速域名与通配符)
    server_names_hash_bucket_size 256;
    server_names_hash_max_size 4096;

    # WebSocket 升级映射
    #
    # ⚠ 已确认此变量无法用于普通反向代理的 keepalive: nginx 只在值是"编译期字面量
    #   空串"时才真正删除 Connection 头, 通过变量求值得到的空串仍会发出空头, 上游
    #   因此不进入 keepalive 复用。
    #   实测对照(同一服务, 连续请求 TTFB / 上游 ESTABLISHED):
    #     proxy_set_header Connection $connection_upgrade;  -> 恒为 0.55~0.71s, 连接数 0
    #     proxy_set_header Connection "";                   -> 第 3 个请求起 0.22~0.24s, 连接数 3
    #   故各 location 一律改用字面量 ""(见 nginx_generator.py), 仅真正需要 WebSocket
    #   升级的 location /ws/ 显式写 "upgrade"。
    #   本 map 保留给将来需要"按请求条件切换"的场景, 当前无引用。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 传输性能调优
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ==========================================================================
    # 访问日志: 全局关闭
    #
    # 为什么必须关 (2026-10-01 实测): 本配置此前没有任何 access_log 指令, nginx 便按默认
    # 写 logs/access.log —— 已部署实例的该文件实测 **183,915,272 字节 (183.9 MB)** 且仍在增长。
    # 它记录的是**解密后的完整请求行**, 因而包含 API key / JWT / 会话 token 等敏感参数,
    # 属于"既占空间又留存凭据"的双重负担。本工具是本地加速器, 访问日志无运维价值。
    #
    # 关闭方式取**全局**而非逐个 server 块: 逐块关闭无法覆盖 nginx_generator 将来新增的
    # location/server (漏一条就继续泄漏), 全局关闭才是"默认安全"。
    # 需要临时排障时改回 `access_log logs/access.log;` 即可。
    # ==========================================================================
    access_log      off;

    # Gzip 压缩
    gzip  on;
    gzip_min_length 1k;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json image/svg+xml;

    # 全局 SSL 与 Universal Root CA 签发的服务端通配证书
    ssl_certificate      ca/pixiv.net.crt;
    ssl_certificate_key  ca/pixiv.net.key;
    ssl_session_cache    shared:SSL:20m;
    ssl_session_timeout  1d;
    ssl_session_tickets  on;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;

    # 全局反向代理默认 SSL 与缓冲区策略 (支持 GitHub / Civitai 超大响应头)
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_headers_hash_max_size 8192;

    # 本地图片磁盘缓存配置 (强化防击穿合并回源与容灾)
    #
    # ⚠ 这里的 max_size 是**磁盘占用上限的唯一真源** (缺陷 D4, 2026-10-04)。
    #   原先 config.json 里还有一个 `cache_max_size_mb: 1024`, 但全仓库**没有任何
    #   代码或界面读它** —— 于是"配置写着 1GB、实际能长到 5GB", 两处数字不一致,
    #   而用户能看到的那一份是错的那一份。那个死键已删除, 现在只有这一个数字。
    #   上限 = 5GB / inactive = 30d: 缓存只服务图片类静态资源 (见各 site-*.conf 里
    #   的 proxy_cache_valid 7d/30d), 命中旧的会被 inactive 淘汰, 超上限则按 LRU 淘汰。
    #   改这个值只需改这一行; tests/test_cache_limit_single_source.py 会守住"只有一处"。
    proxy_cache_path cache/img levels=1:2 keys_zone=pixiv_img_cache:64m inactive=30d max_size=5g;

    # 缓存键必须用 $host (请求的真实域名), 不能用 $proxy_host。
    # 为什么 (2026-10-01 定案): $proxy_host 取的是 proxy_pass 里的 **upstream 名**,
    # 而不是真实 Host —— 于是同一个 upstream 下的多个域名会算出**完全相同**的键,
    # 后到的域直接命中前一个域缓存下来的内容 (t1.gstatic.com 的图会被回给 t0)。
    # 受影响画像 (多域 + enable_cache=True, 实测统计): google_fonts 2 域 /
    # hcaptcha 5 域 / imgur 6 域 / steam_akamai 7 域 / pixiv_img 3 域 / jsdelivr 2 域。
    # 这是先于本次 Google 接入就存在的缺陷 —— google_static 有 20 个域名, 在键修好
    # 之前**刻意不开缓存**, 否则会把串内容的影响面从 2 域放大到 20 域。
    # $host 是 nginx 归一化后的请求域名 (小写、去端口), 与被代理的真实 Host 语义一致;
    # proxy_set_header Host 的覆盖 (如掩护 SNI 场景) 不改变 $host, 正是所需行为。
    proxy_cache_key $scheme$host$uri$is_args$args;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_lock_age 5s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_revalidate on;

    # 引入动态 Upstream 节点配置
    include upstream-dynamic.conf;

    # ==========================================================================
    # ★ 显式默认 server: 把"静默错内容"变成"响亮失败" (2026-10-03 定因, 原缺陷 H5/H5′)
    #
    # 为什么必须有 (实测事实):
    #   · 本机 DNS 用**后缀匹配**决定是否劫持到 127.0.0.1
    #     (`service_profile.get_profile_by_domain`: `d_lower.endswith("." + registered_domain)`),
    #     而 nginx 侧的 server_name 是**精确名单 + 单层通配**。两者覆盖面不等。
    #   · 而 nginx 全文原本**没有任何 default_server** ⇒ 请求落到该 listen 端口上
    #     **第一个** server 块 —— 那是 site-gaming.conf 里的 **Steam 商店**。
    #   · 叶子证书又含 `*.google.com` 这类通配 SAN ⇒ **TLS 握手会成功**。
    #   三者合起来: 未登记的域名得到 "TLS 成功 + HTTP 200 + Steam 内容", 且
    #   `proxy_set_header Host $host` 会把错误的 Host 转给上游。
    #   实测判据: `curl -k --resolve ogs.google.com:443:127.0.0.1 https://ogs.google.com/`
    #   返回的是 Steam 而不是 Google —— 用户看到的是"打开某站出现完全不相干的内容"。
    #
    #   ★ H5′ (2026-10-03 复核新增): 这条不只是"未登记子域"的问题。
    #     `*.googlevideo.com` 在 nginx 里**只匹配一层标签**, 而真实节点名形如
    #     `rr1---sn-xxxx.c.googlevideo.com` (两层)。DNS 仍会把它答到本机、证书也覆盖,
    #     所以 **googlevideo 的日常流量同样落到这个默认 server**。
    #
    # 语义选择: 一律 `return 444` (直接关闭连接, 不回任何响应)。
    #   · 不返回 4xx 页面: 那仍是一个"看起来像回答"的响应, 会诱导播放器/客户端重试;
    #     而 444 让调用方立刻看到一个**响亮的失败**, 与"这个 host 不归这里管"一致;
    #   · 不去猜该转给谁: 猜错就是又一个静默错内容;
    #   · 必须放在 `include site-*.conf` **之前** —— default_server 的归属由"第一个
    #     声明该 listen 的 server 块"决定, 放在后面等于没写。
    # ==========================================================================
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # 不提供任何有用的响应; ssl_certificate 从 http 块继承 (见上方全局 SSL 配置),
        # 因此握手仍会成功 —— 我们**故意**让它成功, 这样失败点落在"连接被关闭"
        # 而不是"证书不受信", 用户不会误以为是证书问题。
        return 444;
    }

    # 引入分类站点规则 (site-tools.conf 服务全部直连不可用已删除)
    # ⚠ 每加一个分组, 这里与 service_profile.SITE_FILE_FOR_GROUP 必须**同时**加:
    #   漏了这里 = 该分组的画像生成了却没人 include (静默不生效);
    #   漏了那张表 = 生成器当场报错 (响亮失败)。
    include site-gaming.conf;
    include site-acg.conf;
    include site-dev.conf;
    include site-adult.conf;
}
