# ==============================================================================
# GameArt Toolkit - 游戏生态全平台加速规则 (由 ServiceProfile 模板自动生成)
# ==============================================================================

map $host $steam_upstream_host {
    hostnames;
    api.steampowered.com api.steampowered.com;
    default steamcommunity.com;
}

# Steam 商店与结账
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name store.steampowered.com checkout.steampowered.com help.steampowered.com login.steampowered.com *.steampowered.com;

    location / {
        proxy_pass https://upstream_steam_store;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_ssl_name "steambroadcast.akamaized.net";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        # 防网关 Portal 劫持重定向，阻断局域网登录地址下发给客户端
        proxy_redirect ~*^https?://(?:172\.|192\.168\.|10\.|.*srun.*|.*portal.*)(.*)$ /;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 4;
    }
}

# Steam 社区与个人资料
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name steamcommunity.com api.steampowered.com *.steamcommunity.com;

    location / {
        proxy_pass https://upstream_steam_community;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $steam_upstream_host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_ssl_name "steambroadcast.akamaized.net";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        # 防网关 Portal 劫持重定向，阻断局域网登录地址下发给客户端
        proxy_redirect ~*^https?://(?:172\.|192\.168\.|10\.|.*srun.*|.*portal.*)(.*)$ /;
        proxy_redirect default;
        proxy_redirect http:// https://;
        proxy_force_ranges on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 4;
    }
}

# Steam 静态图片 CDN
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name community.akamai.steamstatic.com avatars.akamai.steamstatic.com clan.akamai.steamstatic.com steamcommunity-a.akamaihd.net steamuserimages-a.akamaihd.net cdn.akamai.steamstatic.com community.cloudflare.steamstatic.com *.steamstatic.com;

    location / {
        proxy_pass https://upstream_steam_akamai;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_ssl_name "steambroadcast.akamaized.net";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        # 开启本地磁盘缓存 (消除频次冲击与 0ms 秒开)
        proxy_cache pixiv_img_cache;
        proxy_cache_valid 200 304 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 4;
    }
}

