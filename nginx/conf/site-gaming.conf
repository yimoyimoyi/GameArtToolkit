# ==============================================================================
# PixivToolkit - 游戏生态全平台加速规则配置 (Steam / Epic / Ubisoft / EA / GOG / 战网)
# ==============================================================================

# Steam 商店与结账
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name store.steampowered.com checkout.steampowered.com help.steampowered.com login.steampowered.com *.steampowered.com;

    location / {
        proxy_pass https://upstream_steam_store;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_name $host;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504;
    }
}

# Steam 社区与个人资料 (采用 Akamai SNI 绕过 GFW 域名审查)
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name steamcommunity.com *.steamcommunity.com api.steampowered.com;

    location / {
        proxy_pass https://upstream_steam_community;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host "steamcommunity.com";
        proxy_set_header User-Agent "${http_user_agent} Googlebot/2.1 (+http://www.google.com/bot.html)";
        proxy_ssl_name "statuspage.akamaized.net";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504;
    }
}

