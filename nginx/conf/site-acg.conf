# Pixiv 网页与 APP API (采用空 SNI 策略，绕过 GFW SNI 阻断)
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name pixiv.net www.pixiv.net ssl.pixiv.net accounts.pixiv.net touch.pixiv.net oauth.secure.pixiv.net dic.pixiv.net en-dic.pixiv.net sketch.pixiv.net payment.pixiv.net factory.pixiv.net comic.pixiv.net novel.pixiv.net imp.pixiv.net sensei.pixiv.net fanbox.pixiv.net source.pixiv.net i1.pixiv.net i2.pixiv.net i3.pixiv.net i4.pixiv.net app-api.pixiv.net;

    client_max_body_size 50M;

    location / {
        proxy_pass https://upstream_pixiv_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_ssl_name "";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        proxy_next_upstream error timeout http_429 http_404 http_500 http_502 http_503 http_504 non_idempotent;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /ajax/ {
        proxy_pass https://upstream_pixiv_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_ssl_name "";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
        proxy_next_upstream error timeout http_429 http_404 http_500 http_502 http_503 http_504 non_idempotent;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /ws/ {
        proxy_pass https://upstream_pixiv_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
        proxy_ssl_name "";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }
}

